# Build the web game and publish it to GitHub Pages on every push to main.
# Pages serves the gh-pages branch: main's build at the root, and each open
# PR's preview under pr-preview/ (see preview.yml), which this leaves alone.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sh scripts/gh-pages.sh publish dist . "Deploy main ${GITHUB_SHA::7}"
        shell: bash
